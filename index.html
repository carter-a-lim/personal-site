<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>personal-website</title>
    <link rel="stylesheet" href="app-runtime.css" />
    <style>
      :root {
        --ui-scale: 1;
      }
      html {
        font-size: calc(16px * var(--ui-scale));
      }
      body {
        min-width: 320px;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 35%, #0a1e3f 0%, #041125 55%, #020916 100%);
        color: #d8ecff;
        opacity: 1;
        transition: opacity 900ms ease;
      }
      #boot-loader.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-card {
        width: min(520px, 88vw);
        display: grid;
        gap: 0.7rem;
        font-family: "Share Tech Mono", monospace;
      }
      #boot-title {
        margin: 0;
        font-size: clamp(1.2rem, 3vw, 2rem);
        letter-spacing: 0.25rem;
        color: #e8f6ff;
      }
      #boot-hint {
        margin: 0;
        color: rgba(232, 246, 255, 0.82);
        font-size: 0.85rem;
        letter-spacing: 0.08rem;
      }
      #boot-track {
        width: 100%;
        height: 12px;
        border: 1px solid rgba(0, 240, 255, 0.65);
        background: rgba(10, 10, 12, 0.65);
        overflow: hidden;
      }
      #boot-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #00f0ff 0%, #ffee00 100%);
        box-shadow: 0 0 16px rgba(0, 240, 255, 0.75);
        transition: width 180ms ease;
      }
      #boot-label {
        margin: 0;
        color: rgba(232, 246, 255, 0.9);
        font-size: 0.75rem;
        letter-spacing: 0.08rem;
      }
      #boot-start {
        justify-self: start;
        display: none;
        border: 1px solid rgba(0, 240, 255, 0.78);
        background: rgba(0, 240, 255, 0.18);
        color: #e8f6ff;
        font-family: "Share Tech Mono", monospace;
        letter-spacing: 0.12rem;
        font-size: 0.75rem;
        padding: 0.5rem 0.9rem;
        cursor: pointer;
      }
      #boot-start.visible {
        display: inline-block;
      }
      #boot-start:hover {
        background: rgba(0, 240, 255, 0.3);
      }
      #scene-warmup-overlay {
        position: fixed;
        inset: 0;
        z-index: 9500;
        display: none;
        place-items: center;
        background: radial-gradient(circle at 50% 40%, rgba(8, 18, 40, 0.96), rgba(2, 8, 20, 0.98));
        color: #d8ecff;
        font-family: 'Share Tech Mono', monospace;
        letter-spacing: 0.12rem;
      }
      #scene-warmup-overlay.visible {
        display: grid;
      }
      #contact-flash-overlay {
        position: fixed;
        inset: 0;
        z-index: 9700;
        pointer-events: none;
        opacity: 0;
        background:
          radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.98) 0%, rgba(245, 253, 255, 0.92) 28%, rgba(236, 249, 255, 0.55) 52%, rgba(255, 255, 255, 0) 78%),
          rgba(255, 255, 255, 0.8);
      }
      #contact-flash-overlay.active {
        animation: contactFlashWhite 620ms cubic-bezier(0.25, 0.68, 0.2, 1) forwards;
      }
      @keyframes contactFlashWhite {
        0% {
          opacity: 0;
        }
        24% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      .intro-overlay[data-forced-fade='1'] {
        opacity: 0 !important;
        transition: opacity 680ms cubic-bezier(0.2, 0.7, 0.2, 1) !important;
      }
      .intro-overlay {
        transition: opacity 260ms ease !important;
      }
      .cyber-environment::before {
        content: '';
        position: absolute;
        width: min(24vw, 320px);
        aspect-ratio: 1 / 1;
        left: 50%;
        top: 3.5vh;
        margin-left: calc(min(24vw, 320px) / -2);
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        transform: translateY(14px) scale(0.94);
        transition: opacity 380ms ease, transform 480ms cubic-bezier(0.2, 0.7, 0.2, 1);
        background:
          radial-gradient(circle at 36% 30%, rgba(255, 255, 255, 0.95) 0%, rgba(208, 238, 255, 0.92) 25%, rgba(138, 189, 255, 0.45) 53%, rgba(25, 42, 88, 0.05) 75%, rgba(0, 0, 0, 0) 100%);
        box-shadow:
          0 0 48px rgba(164, 220, 255, 0.55),
          0 0 130px rgba(103, 159, 255, 0.42),
          0 0 240px rgba(67, 116, 218, 0.30),
          0 0 320px rgba(44, 86, 196, 0.20);
        filter: saturate(1.22) brightness(1.08);
      }
      body.sidequests-active .cyber-environment::before {
        opacity: 0.88;
        transform: translateY(0) scale(1);
      }
      @media (max-width: 900px) {
        .cyber-environment::before {
          width: min(44vw, 240px);
          left: 50%;
          top: 4vh;
          margin-left: calc(min(44vw, 240px) / -2);
          opacity: 0;
        }
        body.sidequests-active .cyber-environment::before {
          opacity: 0.68;
        }
      }
      /* Runtime overrides for Experience drag UX */
      .timeline-feed,
      .timeline-summary,
      .timeline-sideprojects,
      .sideproject-list {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .timeline-feed::-webkit-scrollbar,
      .timeline-summary::-webkit-scrollbar,
      .timeline-sideprojects::-webkit-scrollbar,
      .sideproject-list::-webkit-scrollbar {
        display: none;
      }
      .timeline-feed,
      .timeline-sideprojects,
      .event-card,
      .sideproject-card,
      .timeline-kpi,
      .data-shard-btn,
      .timeline-link-btn,
      .profile-tech-side {
        cursor: pointer;
      }
      .timeline-feed.is-dragging,
      .timeline-sideprojects.is-dragging,
      .sideproject-list.is-dragging,
      .profile-tech-side.is-dragging {
        cursor: grabbing !important;
        user-select: none;
      }
      .profile-tech-side {
        position: relative;
        cursor: grab;
      }
      .profile-tech-side::after {
        content: 'drag to scroll \\2193';
        position: absolute;
        right: 0.7rem;
        bottom: 0.5rem;
        font-family: 'Share Tech Mono', monospace;
        font-size: 0.56rem;
        letter-spacing: 0.06rem;
        color: rgba(156, 239, 255, 0.78);
        background: rgba(0, 10, 24, 0.6);
        border: 1px solid rgba(0, 240, 255, 0.35);
        padding: 0.2rem 0.35rem;
        pointer-events: none;
        opacity: 0.9;
        transform: translateY(0);
        transition: opacity 220ms ease, transform 220ms ease;
      }
      .profile-tech-side[data-drag-hinted='1']::after {
        opacity: 0;
        transform: translateY(6px);
      }
      .profile-panel .section-label {
        display: none !important;
      }
      /* Fix mojibake marker glyphs (render actual dots/triangles). */
      .event-card span::before,
      .sideproject-card p::before {
        content: '\2022' !important;
      }
      .tech-tag::before,
      .bd-item::before {
        content: '\25B8' !important;
      }
      /* Incoming call: gray rectangular panel */
      .call-notification {
        background: rgba(78, 82, 90, 0.92);
        border: 1px solid rgba(210, 216, 228, 0.4);
        border-radius: 0;
        padding: 1.1rem 1.3rem 1.2rem;
        min-width: min(88vw, 360px);
        z-index: 12050 !important;
        box-shadow:
          0 12px 32px rgba(0, 0, 0, 0.45),
          inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .call-label {
        color: #dff4ff !important;
      }
      .call-name {
        color: #f7fbff !important;
      }
      .call-actions {
        position: relative;
        z-index: 12051;
      }
      .call-btn {
        position: relative;
        z-index: 12052;
      }
      .sideproject-card {
        transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      }
      .sideproject-card:hover {
        transform: translateX(4px);
        border-color: rgba(0, 240, 255, 0.75) !important;
        box-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
      }
      @media (max-width: 1200px) {
        .timeline-panel {
          padding: 0.8rem 1.2rem 0.8rem !important;
        }
      }
      /* Sidequests hologram cards: angled toward viewer with soft glitching */
      .sidequests-panel .quests-grid {
        perspective: 1200px;
        transform-style: preserve-3d;
        position: fixed;
        inset: 0;
        width: 100vw;
        max-width: none;
        pointer-events: none;
        display: block;
        transform: none !important;
      }
      .sidequests-panel .quest-card {
        position: relative;
        background: linear-gradient(165deg, rgba(2, 28, 40, 0.72), rgba(5, 14, 30, 0.42));
        border: 1px solid rgba(91, 224, 255, 0.35);
        border-left: 3px solid rgba(92, 239, 255, 0.95);
        box-shadow:
          0 0 24px rgba(0, 240, 255, 0.18),
          inset 0 0 38px rgba(0, 240, 255, 0.08);
        backdrop-filter: blur(2px);
        transform-style: preserve-3d;
        min-height: 320px;
        width: min(33vw, 440px);
        pointer-events: auto;
      }
      .sidequests-panel .quest-card::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(146, 243, 255, 0) 0px,
            rgba(146, 243, 255, 0) 2px,
            rgba(146, 243, 255, 0.08) 2px,
            rgba(146, 243, 255, 0.08) 3px
          );
        mix-blend-mode: screen;
        opacity: 0.6;
        animation: holoScan 2.4s linear infinite;
      }
      .sidequests-panel .quest-card::after {
        content: '';
        position: absolute;
        inset: -1px;
        pointer-events: none;
        border: 1px solid rgba(183, 247, 255, 0.3);
        clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        opacity: 0.7;
        animation: holoEdgeJitter 3.1s steps(2) infinite;
      }
      .sidequests-panel .quest-pop:nth-child(1) {
        position: absolute;
        left: 3.5vw;
        bottom: 7vh;
        transform: perspective(1200px) rotateY(15deg) rotateX(4deg) !important;
      }
      .sidequests-panel .quest-pop:nth-child(2) {
        position: absolute;
        right: 3.5vw;
        bottom: 7vh;
        transform: perspective(1200px) rotateY(-15deg) rotateX(4deg) !important;
        opacity: 1;
      }
      .sidequests-panel .quest-pop:nth-child(3) {
        position: absolute;
        right: 5vw;
        top: 22vh;
        transform: perspective(1200px) rotateY(-12deg) rotateX(4deg) !important;
      }
      .sidequests-panel .quest-card:hover {
        transform: translateY(-6px) scale(1.01) !important;
      }
      .sidequests-panel .quest-header,
      .sidequests-panel .quest-card p,
      .sidequests-panel .quest-photo {
        position: relative;
        z-index: 1;
      }
      .sidequests-panel .quest-photo {
        height: 150px;
        color: transparent;
        text-indent: -9999px;
        overflow: hidden;
        background-position: center;
        background-size: 100% 100%, 100% 100%, contain !important;
        background-repeat: no-repeat;
        background-color: rgba(2, 10, 22, 0.92);
        background-image:
          linear-gradient(130deg, rgba(0, 240, 255, 0.2), rgba(255, 0, 140, 0.18)),
          radial-gradient(circle at 75% 20%, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0) 50%),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.06) 2px, rgba(255, 255, 255, 0) 2px, rgba(255, 255, 255, 0) 7px);
        border: 1px solid rgba(116, 235, 255, 0.5);
      }
      .sidequests-panel .quest-pop:nth-child(1) .quest-photo {
        background-image:
          linear-gradient(130deg, rgba(0, 240, 255, 0.2), rgba(255, 0, 140, 0.18)),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.06) 2px, rgba(255, 255, 255, 0) 2px, rgba(255, 255, 255, 0) 7px),
          url('signal-2026-02-27-164119.jpeg');
      }
      .sidequests-panel .quest-pop:nth-child(2) .quest-photo {
        background-image:
          linear-gradient(130deg, rgba(0, 240, 255, 0.2), rgba(255, 0, 140, 0.18)),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.06) 2px, rgba(255, 255, 255, 0) 2px, rgba(255, 255, 255, 0) 7px),
          url('IMG_0508.jpg');
      }
      .sidequests-panel .quest-pop:nth-child(3) .quest-photo {
        background-image:
          linear-gradient(130deg, rgba(0, 240, 255, 0.2), rgba(255, 0, 140, 0.18)),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.06) 2px, rgba(255, 255, 255, 0) 2px, rgba(255, 255, 255, 0) 7px),
          url('IMG_6904.jpg');
      }
      .sidequests-panel .section-label {
        margin-bottom: 0.8rem !important;
        position: relative;
        z-index: 7;
      }
      .sidequests-panel .section-heading {
        margin-top: 0 !important;
        margin-bottom: 1.2rem !important;
        position: relative;
        z-index: 6;
      }
      @keyframes holoScan {
        0% { transform: translateY(-2%); opacity: 0.55; }
        50% { transform: translateY(2%); opacity: 0.78; }
        100% { transform: translateY(-2%); opacity: 0.55; }
      }
      @keyframes holoEdgeJitter {
        0%, 90%, 100% { transform: translate(0, 0); opacity: 0.68; }
        91% { transform: translate(1px, -1px); opacity: 0.9; }
        93% { transform: translate(-1px, 0px); opacity: 0.45; }
        95% { transform: translate(1px, 1px); opacity: 0.82; }
      }
      @media (max-width: 1200px) {
        .sidequests-panel .quests-grid {
          position: static;
          width: 100%;
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 1.2rem;
          pointer-events: auto;
        }
        .sidequests-panel .quest-card {
          width: 100%;
        }
        .sidequests-panel .quest-pop:nth-child(1),
        .sidequests-panel .quest-pop:nth-child(2),
        .sidequests-panel .quest-pop:nth-child(3) {
          position: static;
          transform: perspective(1000px) rotateY(0deg) rotateX(2deg) translateY(0) translateX(0) scale(1) !important;
          opacity: 1;
        }
      }
      /* Critical banner: auto-fade out after 3s even if active class remains */
      .critical-banner.active {
        animation: criticalBannerAutoFade 3s ease-out forwards !important;
      }
      @keyframes criticalBannerAutoFade {
        0% { opacity: 0; }
        12% { opacity: 1; }
        80% { opacity: 1; }
        100% { opacity: 0; }
      }
      .critical-banner,
      .critical-banner.active {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      /* Suppress transition visuals while preload warmup runs behind loader. */
      body.preload-silent .impact-frame.flash,
      body.preload-silent .wipe-band.animate {
        animation: none !important;
        opacity: 0 !important;
      }
      body.preload-silent .impact-frame,
      body.preload-silent .wipe-container,
      body.preload-silent .sandevistan-container,
      body.preload-silent .vr-headset-overlay,
      body.preload-silent .glasses-transition,
      body.preload-silent .call-notification {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }
      /* Canvas layers stay fixed; camera movement is handled in runtime. */
      .canvas-normal,
      .canvas-blur {
        transform: translate3d(0, 0, 0);
        opacity: 1;
        transition: opacity 320ms ease;
        will-change: opacity;
      }

      /* Contact scene: fade to white into rotated Pinterest video (no 3D zoom). */
      #contact-video-scene {
        position: fixed;
        inset: 0;
        z-index: 60;
        pointer-events: none;
        opacity: 0;
        background: #000;
        transition: opacity 70ms linear;
        overflow: hidden;
        will-change: opacity;
      }
      #contact-video-scene video {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100vh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(-90deg) scale(1.06);
        transform-origin: center center;
        object-fit: cover;
        filter: brightness(0.9) contrast(1.08);
      }
      body.contact-active #contact-video-scene,
      body.contact-lock #contact-video-scene {
        opacity: 1;
      }
      body.contact-active .canvas-normal,
      body.contact-active .canvas-blur,
      body.contact-lock .canvas-normal,
      body.contact-lock .canvas-blur,
      body.contact-active .cyber-city,
      body.contact-lock .cyber-city,
      body.contact-active .cyber-environment::before,
      body.contact-lock .cyber-environment::before,
      body.contact-active .cyber-environment::after,
      body.contact-lock .cyber-environment::after {
        opacity: 0 !important;
        visibility: hidden !important;
      }
      /* Contact readability: boost UI contrast over bright video */
      body.contact-active .hud,
      body.contact-active .hud-top,
      body.contact-active .section-overlay,
      body.contact-active .contact-panel,
      body.contact-active .nav-tags {
        isolation: isolate;
      }
      body.contact-active .hud::before,
      body.contact-active .section-overlay::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: -1;
        background: radial-gradient(circle at 50% 40%, rgba(0, 0, 0, 0.22) 0%, rgba(0, 0, 0, 0.62) 82%);
      }
      body.contact-active .logo,
      body.contact-active .scroll-hint,
      body.contact-active .section-label,
      body.contact-active .section-heading,
      body.contact-active .contact-panel p,
      body.contact-active .hud-status,
      body.contact-active .humanity-label,
      body.contact-active .humanity-pct {
        color: #f4fbff !important;
        text-shadow:
          0 0 2px rgba(0, 0, 0, 0.9),
          0 0 14px rgba(0, 0, 0, 0.8),
          0 0 28px rgba(0, 0, 0, 0.6);
      }
      body.contact-active .nav-tags {
        padding: 0.45rem 0.7rem;
        background: rgba(0, 6, 14, 0.72);
        border: 1px solid rgba(180, 235, 255, 0.42);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      }
      body.contact-active .nav-tags a {
        color: rgba(236, 248, 255, 0.92) !important;
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      }
      body.contact-active .nav-tags a[data-active='true'] {
        background: #e8f6ff !important;
        color: #001322 !important;
      }
      body.contact-active .social-btn {
        background: rgba(0, 8, 16, 0.72);
        border-color: rgba(230, 248, 255, 0.9);
        color: #f5fcff;
        box-shadow: 0 0 24px rgba(0, 0, 0, 0.55);
      }
      body.contact-active .social-btn:hover {
        background: #e8f6ff;
        color: #001322;
        border-color: #e8f6ff;
      }
      body.contact-active .contact-panel > p:not(.section-label) {
        background: rgba(0, 6, 16, 0.72);
        border: 1px solid rgba(212, 240, 255, 0.44);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.35) inset,
          0 10px 26px rgba(0, 0, 0, 0.42);
        padding: 0.55rem 0.85rem;
        border-radius: 2px;
        backdrop-filter: blur(2px);
      }
      .contact-panel .section-heading {
        position: relative;
        display: block;
        width: 100%;
        min-height: clamp(4.8rem, 10vw, 8.2rem);
        margin-bottom: 2rem !important;
        font-size: 0 !important;
        line-height: 1 !important;
        color: transparent !important;
        text-shadow: none !important;
      }
      .contact-panel .section-heading::before {
        display: none !important;
      }
      .contact-panel .section-heading::after {
        content: 'CONTACT';
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(3rem, 7vw, 6rem);
        line-height: 1;
        color: #f4fbff;
        text-shadow:
          0 0 2px rgba(0, 0, 0, 0.9),
          0 0 14px rgba(0, 0, 0, 0.8),
          0 0 28px rgba(0, 0, 0, 0.6);
        white-space: nowrap;
      }
      body.contact-active .contact-panel .section-heading + p {
        margin-top: 0.15rem !important;
      }
      body.contact-active .contact-panel {
        z-index: 95 !important;
        pointer-events: none !important;
      }
      body.contact-active .social-row {
        position: relative;
        z-index: 131;
        pointer-events: auto;
      }
      body.contact-active .social-btn {
        position: relative;
        z-index: 132;
        pointer-events: auto;
      }
      body.contact-active .social-row .social-btn:not(:last-child) {
        display: none !important;
      }
      @media (max-width: 900px) {
        #contact-video-scene video {
          transform: translate(-50%, -50%) rotate(-90deg) scale(1.18);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="scene-warmup-overlay">WARMING SCENE SHADERS...</div>
    <div id="contact-flash-overlay" aria-hidden="true"></div>
    <div id="contact-video-scene" aria-hidden="true">
      <video
        id="contact-video"
        src="contact-pinterest.mp4"
        muted
        loop
        playsinline
        preload="auto"
      ></video>
    </div>
    <div id="boot-loader">
      <div id="boot-card">
        <h1 id="boot-title">INITIALIZING CITY FEED</h1>
        <p id="boot-hint">Use headphones for best experience.</p>
        <div id="boot-track"><div id="boot-fill"></div></div>
        <p id="boot-label">Loading assets... 0%</p>
        <button id="boot-start" type="button">START</button>
      </div>
    </div>
    <script type="module">
      (async () => {
      const ASSETS = [
        '/app-runtime.css',
        '/app-runtime.js',
        '/Cyberpunk_ Edgerunners  I Really Want to Stay At Your House by Rosa Walton  Netflix.mp3',
        '/mixkit-arcade-mechanical-bling-210.wav',
        '/mixkit-fast-swipe-zoom-2627.wav',
        '/mixkit-machine-activation-short-3180.wav',
        '/mixkit-sci-fi-positive-notification-266.wav',
        '/contact-pinterest.mp4',
        '/tech-icons/antigravity.svg',

        const current = getActiveNavLabel();
        if (!current || current === lastActiveNav) return;
        if (isRunningSceneWarmup) {
          lastActiveNav = current;
          return;
        }
        const profileToExperience = lastActiveNav === 'PROFILE' && current === 'EXPERIENCE';
        const experienceToProfile = lastActiveNav === 'EXPERIENCE' && current === 'PROFILE';
        if (profileToExperience || experienceToProfile) {
          playProfileExperienceSwipeSfx();
        }
        if (current === 'CONTACT' && lastActiveNav !== 'CONTACT') {
          triggerContactTransitionFx();
        }
        document.body.classList.toggle('contact-lock', current === 'CONTACT');
        lastActiveNav = current;
      });
      navObserver.observe(document.body, {
        subtree: true,
        attributes: true,
        attributeFilter: ['data-active'],
      });
      document.addEventListener(
        'click',
        (event) => {
          const target = event.target;
          if (!(target instanceof Element)) return;
          const navLink = target.closest('.nav-tags a');
          if (!navLink) return;
          const navText = (navLink.textContent || '').trim().toUpperCase();
          const lockingContact = navText === 'CONTACT';
          document.body.classList.toggle('contact-lock', lockingContact);
          if (lockingContact && contactVideo instanceof HTMLVideoElement) {
            void contactVideo.play().catch(() => {});
          }
        },
        true
      );

      // Fallback cleanup: ensure critical banner class is removed after 3s.
      const criticalObserver = new MutationObserver(() => {
        const banner = document.querySelector('.critical-banner.active');
        if (!(banner instanceof HTMLElement)) return;
        if (criticalBannerTimer) clearTimeout(criticalBannerTimer);
        criticalBannerTimer = setTimeout(() => {
          banner.classList.remove('active');
          criticalBannerTimer = null;
        }, 3000);
      });
      criticalObserver.observe(document.body, {
        subtree: true,
        attributes: true,
        attributeFilter: ['class'],
      });

      // Experience hover SFX: trigger on new hovered card-like elements.
      let lastExperienceHover = null;
      document.addEventListener(
        'pointerover',
        (event) => {
          const target = event.target;
          if (!(target instanceof Element)) return;
          const timelinePanel = document.querySelector('.timeline-panel.visible');
          if (!timelinePanel) return;
          const hoverItem = target.closest('.event-card, .timeline-kpi, .timeline-link-btn, .data-shard-btn, .sideproject-card');
          if (!hoverItem || !timelinePanel.contains(hoverItem)) return;
          if (hoverItem === lastExperienceHover) return;
          lastExperienceHover = hoverItem;
          playExperienceHoverSfx();
        },
        { passive: true }
      );

      // Make experience feed click-and-drag scrollable.
      const enableDragScroll = (selector) => {
        const state = new WeakMap();
        const tryAttach = () => {
          document.querySelectorAll(selector).forEach((el) => {
            if (!(el instanceof HTMLElement)) return;
            if (state.has(el)) return;
            const s = { active: false, startY: 0, startX: 0, top: 0, left: 0 };
            state.set(el, s);
            el.addEventListener('pointerdown', (event) => {
              if (event.button !== 0) return;
              s.active = true;
              el.setAttribute('data-drag-hinted', '1');
              s.startY = event.clientY;
              s.startX = event.clientX;
              s.top = el.scrollTop;
              s.left = el.scrollLeft;
              el.classList.add('is-dragging');
              el.setPointerCapture(event.pointerId);
            });
            el.addEventListener('pointermove', (event) => {
              if (!s.active) return;
              const dy = event.clientY - s.startY;
              const dx = event.clientX - s.startX;
              el.scrollTop = s.top - dy;
              el.scrollLeft = s.left - dx;
            });
            const stop = (event) => {
              if (!s.active) return;
              s.active = false;
              el.classList.remove('is-dragging');
              try {
                el.releasePointerCapture(event.pointerId);
              } catch (_) {}
            };
            el.addEventListener('pointerup', stop);
            el.addEventListener('pointercancel', stop);
            el.addEventListener('pointerleave', stop);
          });
        };
        tryAttach();
        const mo = new MutationObserver(tryAttach);
        mo.observe(document.body, { childList: true, subtree: true });
      };
      enableDragScroll('.timeline-feed, .timeline-sideprojects, .sideproject-list, .profile-tech-side');

      // One-pass scene warmup: load each section once so first user transition is already compiled.
      const runSceneWarmup = async () => {
        if (hasSceneWarmupRun || isRunningSceneWarmup) return;
        isRunningSceneWarmup = true;
        sceneWarmupOverlay?.classList.add('visible');
        const sequence = [
          ['HOME', '.hero-text', 180, 10],
          ['PROFILE', '.profile-panel.visible', 240, 14],
          ['EXPERIENCE', '.timeline-panel.visible', 240, 14],
          ['SIDE QUESTS', '.sidequests-panel.visible', 320, 18],
          ['CONTACT', '.contact-panel.visible', 220, 12],
          ['HOME', '.hero-text', 160, 10],
        ];
        const totalSteps = sequence.length + 1;
        let stepIndex = 0;
        const setWarmupStep = (text) => {
          stepIndex += 1;
          if (label) {
            label.textContent = `Scene preload ${stepIndex}/${totalSteps}: ${text}`;
          }
        };
        try {
          for (const [labelText, visibleSelector, settleMs, frameCount] of sequence) {
            setWarmupStep(`Warming ${labelText}`);
            clickNav(labelText);
            await waitFor(visibleSelector, 2200);
            await waitFrames(frameCount);
            await sleep(settleMs);
          }
          setWarmupStep('Finalizing cache');
          hasSceneWarmupRun = true;
        } finally {
          isRunningSceneWarmup = false;
          sceneWarmupOverlay?.classList.remove('visible');
        }
      };

      const startIntroAndWaitReady = async () => {
        // Runtime can already be interactive; only drive intro if it's still visible.
        const nav = await waitFor('.nav-tags', 1200);
        if (nav) {
          await waitFrames(6);
          return;
        }
        const enterBtn = await waitFor('.intro-enter', 9000);
        if (enterBtn instanceof HTMLElement) {
          enterBtn.click();
        }
        await waitFor('.nav-tags', 7000);
        await waitUntil(() => !document.querySelector('.intro-overlay'), 5000, 40);
        await waitFrames(10);
      };

      // Scene atmosphere toggles.
      const syncSceneAtmosphere = () => {
        const onSidequests = !!document.querySelector('.sidequests-panel.visible');
        const onContact = !!document.querySelector('.contact-panel.visible') || document.body.classList.contains('contact-lock');
        document.body.classList.toggle('sidequests-active', onSidequests);
        document.body.classList.toggle('contact-active', onContact);
        const contactPanel = document.querySelector('.contact-panel');
        if (contactPanel) {
          const ctas = Array.from(contactPanel.querySelectorAll('.social-row .social-btn'));
          const emailCta = ctas.find((node) => {
            if (!(node instanceof HTMLAnchorElement)) return false;
            const text = (node.textContent || '').trim().toUpperCase();
            const href = (node.getAttribute('href') || '').toLowerCase();
            return text.includes('EMAIL') || href.startsWith('mailto:');
          });
          if (emailCta instanceof HTMLAnchorElement) {
            emailCta.textContent = 'EMAIL ME';
            emailCta.setAttribute('href', 'mailto:clim40@calpoly.edu');
          }
        }
        if (contactVideo instanceof HTMLVideoElement) {
          if (contactVideoPauseTimer) {
            clearTimeout(contactVideoPauseTimer);
            contactVideoPauseTimer = null;
          }
          if (onContact) {
            void contactVideo.play().catch(() => {});
          } else {
            // Let opacity crossfade finish before pausing decode/playback.
            contactVideoPauseTimer = setTimeout(() => {
              contactVideo.pause();
              contactVideoPauseTimer = null;
            }, 420);
          }
        }
      };
      syncSceneAtmosphere();
      const moonObserver = new MutationObserver(syncSceneAtmosphere);
      moonObserver.observe(document.body, {
        subtree: true,
        attributes: true,
        attributeFilter: ['class'],
        childList: true,
      });

      // Ensure intro fade fully completes even on frame drops.
      document.addEventListener(
        'click',
        (event) => {
          const target = event.target;
          if (!(target instanceof Element)) return;
          if (!target.closest('.intro-enter')) return;
          const introOverlay = document.querySelector('.intro-overlay');
          if (!introOverlay) return;
          introOverlay.setAttribute('data-forced-fade', '1');
        },
        { passive: true }
      );

      const minVisible = 1800;
      const elapsed = performance.now() - start;
      if (elapsed < minVisible) {
        await new Promise((r) => setTimeout(r, minVisible - elapsed));
      }

      if (!DISABLE_PRELOAD) {
        if (label) {
          label.textContent = 'Warming scene transitions...';
        }
        await startIntroAndWaitReady();
        await runSceneWarmup();
      }
      if (label) {
        label.textContent = 'Ready. Click START to enter.';
      }
      if (bootStart instanceof HTMLElement) {
        bootStart.classList.add('visible');
        await new Promise((resolve) => {
          const onStart = () => {
            bootStart.removeEventListener('click', onStart);
            bootStart.classList.remove('visible');
            suppressPreloadEffects = false;
            document.body.classList.remove('preload-silent');
            enableBackgroundMusic();
            resolve();
          };
          bootStart.addEventListener('click', onStart);
        });
      }

      if (loader instanceof HTMLElement) {
        loader.classList.add('done');
        await new Promise((resolve) => {
          let done = false;
          const finish = () => {
            if (done) return;
            done = true;
            resolve();
          };
          loader.addEventListener(
            'transitionend',
            (event) => {
              if (event.target !== loader) return;
              if (event.propertyName !== 'opacity') return;
              finish();
            },
            { once: true }
          );
          setTimeout(finish, 1100);
        });
        loader.remove();
      }
      })();
    </script>
  </body>
</html>
