        transform: translateY(14px) scale(0.94);
        transition: opacity 380ms ease, transform 480ms cubic-bezier(0.2, 0.7, 0.2, 1);

          radial-gradient(circle at 36% 30%, rgba(255, 255, 255, 0.95) 0%, rgba(208, 238, 255, 0.92) 25%, rgba(138, 189, 255, 0.45) 53%, rgba(25, 42, 88, 0.05) 75%, rgba(0, 0, 0, 0) 100%);

          0 0 240px rgba(67, 116, 218, 0.30),
          0 0 320px rgba(44, 86, 196, 0.20);

          top: 14vh;
        }

      /* Runtime overrides for Experience drag UX */

      }

      .sideproject-card:hover {

      @media (max-width: 1200px) {
        .timeline-panel {
          padding: 0.8rem 1.2rem 0.8rem !important;

      /* Sidequests hologram cards: angled toward viewer with soft glitching */
      .sidequests-panel .quests-grid {
        perspective: 1200px;
        transform-style: preserve-3d;
        position: fixed;
        inset: 0;
        width: 100vw;
        max-width: none;
        pointer-events: none;
        display: block;
        transform: none !important;
      }
      .sidequests-panel .quest-card {
        position: relative;
        background: linear-gradient(165deg, rgba(2, 28, 40, 0.72), rgba(5, 14, 30, 0.42));
        border: 1px solid rgba(91, 224, 255, 0.35);
        border-left: 3px solid rgba(92, 239, 255, 0.95);
        box-shadow:
          0 0 24px rgba(0, 240, 255, 0.18),
          inset 0 0 38px rgba(0, 240, 255, 0.08);
        backdrop-filter: blur(2px);
        transform-style: preserve-3d;
        min-height: 320px;
        width: min(33vw, 440px);
        pointer-events: auto;
      }
      .sidequests-panel .quest-card::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(146, 243, 255, 0) 0px,
            rgba(146, 243, 255, 0) 2px,
            rgba(146, 243, 255, 0.08) 2px,
            rgba(146, 243, 255, 0.08) 3px
          );
        mix-blend-mode: screen;
        opacity: 0.6;
        animation: holoScan 2.4s linear infinite;
      }
      .sidequests-panel .quest-card::after {
        content: '';
        position: absolute;
        inset: -1px;
        pointer-events: none;
        border: 1px solid rgba(183, 247, 255, 0.3);
        clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        opacity: 0.7;
        animation: holoEdgeJitter 3.1s steps(2) infinite;
      }
      .sidequests-panel .quest-pop:nth-child(1) {
        position: absolute;
        left: 3.5vw;
        bottom: 7vh;
        transform: perspective(1200px) rotateY(15deg) rotateX(4deg) !important;
      }
      .sidequests-panel .quest-pop:nth-child(2) {
        position: absolute;
        right: 3.5vw;
        bottom: 7vh;
        transform: perspective(1200px) rotateY(-15deg) rotateX(4deg) !important;
        opacity: 1;
      }
      .sidequests-panel .quest-pop:nth-child(3) {
        position: absolute;
        right: 5vw;
        top: 22vh;
        transform: perspective(1200px) rotateY(-12deg) rotateX(4deg) !important;
      }
      .sidequests-panel .quest-card:hover {
        transform: translateY(-6px) scale(1.01) !important;
      }
      .sidequests-panel .quest-header,
      .sidequests-panel .quest-card p,
      .sidequests-panel .quest-photo {
        position: relative;
        z-index: 1;
      }
      .sidequests-panel .quest-photo {
        height: 150px;
        overflow: hidden;
        background-color: rgba(2, 10, 22, 0.92);

        border: 1px solid rgba(116, 235, 255, 0.5);
      }
      .sidequests-panel .quest-photo > img,
      .sidequests-panel .quest-photo > video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center center;
        display: block;
      }
      .sidequests-panel .section-label {
        margin-bottom: 0.8rem !important;
        position: relative;
        z-index: 7;
      }
      .sidequests-panel .section-heading {
        margin-top: 0 !important;
        margin-bottom: 1.2rem !important;
        position: relative;
        z-index: 6;
      }
      @keyframes holoScan {
        0% { transform: translateY(-2%); opacity: 0.55; }
        50% { transform: translateY(2%); opacity: 0.78; }
        100% { transform: translateY(-2%); opacity: 0.55; }
      }
      @keyframes holoEdgeJitter {
        0%, 90%, 100% { transform: translate(0, 0); opacity: 0.68; }
        91% { transform: translate(1px, -1px); opacity: 0.9; }
        93% { transform: translate(-1px, 0px); opacity: 0.45; }

      @media (max-width: 1200px) {
        .sidequests-panel .quests-grid {
          position: static;

          width: 100%;

        .sidequests-panel .quest-pop:nth-child(1),
        .sidequests-panel .quest-pop:nth-child(2),

          position: static;
          transform: perspective(1000px) rotateY(0deg) rotateX(2deg) translateY(0) translateX(0) scale(1) !important;
          opacity: 1;
        }
      }
      /* Sidequests replacement: Braindance scrubber */
      body.sidequests-active .sidequests-panel {
        opacity: 0 !important;
        pointer-events: none !important;
      }
      #bd-scrubber {

      .bd-shell {

  <body>
    <div id="root"></div>
    <div id="bd-scrubber"></div>
    <div id="scene-warmup-overlay">WARMING SCENE SHADERS...</div>
    <div id="contact-flash-overlay" aria-hidden="true"></div>
    <div id="contact-video-scene" aria-hidden="true">
      <video
        id="contact-video"
        src="contact-pinterest.mp4"
        muted
        loop
        playsinline
        preload="auto"
      ></video>
    </div>
    <div id="boot-loader">
      <div id="boot-card">
        <h1 id="boot-title">PRELOADING ASSETS</h1>
        <p id="boot-hint">Preparing files for a smooth first run.</p>
        <div id="boot-track"><div id="boot-fill"></div></div>
        <p id="boot-label">Loading assets... 0%</p>
        <button id="boot-start" type="button">START</button>
      </div>
    </div>
    <script type="module">
      (() => {
        const loader = document.getElementById('boot-loader');
        const fill = document.getElementById('boot-fill');
        const label = document.getElementById('boot-label');
        const hint = document.getElementById('boot-hint');
        const startButton = document.getElementById('boot-start');
        const contactVideo = document.getElementById('contact-video');

        if (startButton instanceof HTMLElement) {
          startButton.remove();
        }

        const MANIFEST_PATH = 'asset-manifest.json';
        const RUNTIME_PATH = 'app-runtime.js';
        const CONCURRENCY = 8;

        const setProgress = (done, total, message) => {
          if (fill instanceof HTMLElement) {
            const pct = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 100;
            fill.style.width = `${pct}%`;
          }
          if (label instanceof HTMLElement && message) {
            label.textContent = message;
          }
        };

        const loadRuntime = () =>
          new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.type = 'module';
            script.src = RUNTIME_PATH;
            script.onload = () => resolve();
            script.onerror = (event) => reject(event);
            document.body.appendChild(script);
          });

        const toAssetUrl = (assetPath) => encodeURI(assetPath);

        const normalizeLabel = (value) => String(value || '').replace(/\s+/g, '').toUpperCase();

        const installUiSfx = () => {
          if (window.__UI_SFX_READY__) return;
          window.__UI_SFX_READY__ = true;

          const SOUND = {
            nav: { src: 'mixkit-fast-swipe-zoom-2627.wav', volume: 0.34 },
            confirm: { src: 'mixkit-sci-fi-positive-notification-266.wav', volume: 0.42 },
            ui: { src: 'mixkit-arcade-mechanical-bling-210.wav', volume: 0.34 },
            activate: { src: 'mixkit-machine-activation-short-3180.wav', volume: 0.36 },
          };

          const pools = new Map();
          let audioUnlocked = false;
          let lastNav = '';

          const canPlayNow = () => {
            if (document.body.classList.contains('preload-silent')) return false;
            if (window.__PRELOAD_ALLOW_NAV__) return false;
            return true;
          };

          const makePool = (name, size = 3) => {
            const config = SOUND[name];
            if (!config) return [];
            const list = Array.from({ length: size }, () => {
              const audio = new Audio(toAssetUrl(config.src));
              audio.preload = 'auto';
              audio.volume = config.volume;
              audio.load();
              return audio;
            });
            pools.set(name, { list, idx: 0 });
            return list;
          };

          const getPool = (name) => {
            if (!pools.has(name)) {
              makePool(name);
            }
            return pools.get(name);
          };

          const play = (name) => {
            if (!audioUnlocked || !canPlayNow()) return;
            const pool = getPool(name);
            if (!pool || !pool.list.length) return;
            pool.idx = (pool.idx + 1) % pool.list.length;
            const audio = pool.list[pool.idx];
            try {
              audio.currentTime = 0;
              void audio.play().catch(() => {});
            } catch {}
          };

          const unlockAudio = () => {
            if (audioUnlocked) return;
            audioUnlocked = true;
            ['nav', 'confirm', 'ui', 'activate'].forEach((key) => {
              const pool = getPool(key);
              if (!pool || !pool.list.length) return;
              const a = pool.list[0];
              try {
                a.currentTime = 0;
                const p = a.play();
                if (p && typeof p.then === 'function') {
                  p.then(() => {
                    a.pause();
                    a.currentTime = 0;
                  }).catch(() => {});
                }
              } catch {}
            });
          };

          document.addEventListener('pointerdown', unlockAudio, { passive: true, once: true });
          document.addEventListener('keydown', unlockAudio, { once: true });
          document.addEventListener('touchstart', unlockAudio, { passive: true, once: true });

          const getActiveNavLabel = () => {
            const activeNav = document.querySelector('.nav-tags a[data-active="true"]');
            return normalizeLabel(activeNav?.textContent || '');
          };

          const navObserver = new MutationObserver(() => {
            const active = getActiveNavLabel();
            if (!active || active === lastNav) return;
            if (lastNav) {
              play(active === 'CONTACT' ? 'confirm' : 'nav');
            }
            lastNav = active;
          });
          navObserver.observe(document.body, {
            subtree: true,
            childList: true,
            attributes: true,
            attributeFilter: ['data-active', 'class'],
          });
          lastNav = getActiveNavLabel();

          document.addEventListener(
            'click',
            (event) => {
              const target = event.target;
              if (!(target instanceof Element)) return;

              if (target.closest('.intro-enter')) {
                play('activate');
                return;
              }

              if (target.closest('.call-btn.accept') || target.closest('.call-btn.decline')) {
                play('confirm');
                return;
              }

              if (target.closest('.data-shard-btn, .timeline-link-btn, .social-btn, .bd-link-chip')) {
                play('ui');
                return;
              }

              const maybeMusic = target.closest('button');
              if (maybeMusic instanceof HTMLButtonElement) {
                const txt = (maybeMusic.textContent || '').trim().toUpperCase();
                if (txt.startsWith('MUSIC:')) {
                  play('activate');
                }
              }
            },
            true
          );
        };

        const syncSceneClasses = () => {
          const activeNav = document.querySelector('.nav-tags a[data-active="true"]');
          const activeLabel = normalizeLabel(activeNav?.textContent || '');
          const contactPanelVisible = !!document.querySelector('.contact-panel.visible');
          const sidequestsPanelVisible = !!document.querySelector('.sidequests-panel.visible');
          const onContact = activeLabel === 'CONTACT' || contactPanelVisible;
          const onSidequests = activeLabel === 'SIDEQUESTS' || sidequestsPanelVisible;

          document.body.classList.toggle('contact-active', onContact);
          document.body.classList.toggle('contact-lock', onContact);
          document.body.classList.toggle('sidequests-active', onSidequests && !onContact);
          if (onSidequests && !onContact) {
            installBraindanceScrubber();
          }

          if (contactVideo instanceof HTMLVideoElement) {
            if (onContact) {
              void contactVideo.play().catch(() => {});
            } else {
              contactVideo.pause();
            }
          }
        };

        const installSceneClassSync = () => {
          let syncQueued = false;
          const queueSync = () => {
            if (syncQueued) return;
            syncQueued = true;
            requestAnimationFrame(() => {
              syncQueued = false;
              syncSceneClasses();
            });
          };

          const observer = new MutationObserver(() => queueSync());
          observer.observe(document.body, {
            subtree: true,
            childList: true,
            attributes: true,
            attributeFilter: ['class', 'data-active'],
          });

          document.addEventListener('click', queueSync, true);
          window.addEventListener('hashchange', queueSync);
          queueSync();
        };

        const preloadAsset = async (assetPath) => {
          const response = await fetch(toAssetUrl(assetPath), { cache: 'force-cache' });
          if (!response.ok) {
            throw new Error(`Failed ${assetPath}: ${response.status}`);
          }
          // Read the response so the browser fully warms the cache.
          await response.blob();
        };

        const preloadInBatches = async (assets, onTick) => {
          let cursor = 0;
          let done = 0;
          let failed = 0;

          const worker = async () => {
            while (cursor < assets.length) {
              const index = cursor;
              cursor += 1;
              const asset = assets[index];
              try {
                await preloadAsset(asset);
              } catch (error) {
                failed += 1;
                console.warn('[loader] preload failed:', asset, error);
              } finally {
                done += 1;
                onTick(done, failed, asset);
              }
            }
          };

          const workers = Array.from(
            { length: Math.max(1, Math.min(CONCURRENCY, assets.length || 1)) },
            () => worker()
          );
          await Promise.all(workers);
          return { done, failed };
        };

        const wait = (ms) =>
          new Promise((resolve) => {
            window.setTimeout(resolve, ms);
          });

        const waitForCanvas = async (timeoutMs = 8000) => {
          const start = performance.now();
          while (performance.now() - start < timeoutMs) {
            if (document.querySelector('#root canvas')) {
              return true;
            }
            await wait(50);
          }
          return false;
        };

        const installMobileHeroAutoLayout = () => {
          const isMobile = window.matchMedia('(max-width: 900px)').matches;
          if (!isMobile) {
            return;
          }

          const rootStyle = document.documentElement.style;
          let rafId = 0;

          const apply = () => {
            rafId = 0;
            const heroName = document.querySelector('.hero-name');
            if (!(heroName instanceof HTMLElement)) {
              return;
            }

            // Measure at neutral transform, then fit the full composed box.
            rootStyle.setProperty('--hero-mobile-x', '0px');
            rootStyle.setProperty('--hero-mobile-y', '0px');
            rootStyle.setProperty('--hero-mobile-scale', '1');

            const rect = heroName.getBoundingClientRect();
            if (rect.width < 8 || rect.height < 8) {
              return;
            }

            const viewportW = window.innerWidth;
            const viewportH = window.innerHeight;
            const horizontalPad = 12;
            const maxBoxW = Math.max(220, viewportW - horizontalPad * 2);
            const maxBoxH = Math.max(140, viewportH * 0.34);

            let scale = Math.min(maxBoxW / rect.width, maxBoxH / rect.height, 0.62);
            scale = Math.max(0.28, scale);

            const targetTop = Math.max(70, viewportH * 0.22);
            const x = (viewportW - rect.width * scale) / 2 - rect.left;
            const y = targetTop - rect.top;

            rootStyle.setProperty('--hero-mobile-x', `${Math.round(x)}px`);
            rootStyle.setProperty('--hero-mobile-y', `${Math.round(y)}px`);
            rootStyle.setProperty('--hero-mobile-scale', String(Number(scale.toFixed(3))));
          };

          const queueApply = () => {
            if (rafId) return;
            rafId = window.requestAnimationFrame(apply);
          };

          const mutationObserver = new MutationObserver(() => queueApply());
          mutationObserver.observe(document.body, {
            subtree: true,
            childList: true,
            attributes: true,
            attributeFilter: ['class', 'style'],
          });

          window.addEventListener('resize', queueApply, { passive: true });
          window.addEventListener('orientationchange', queueApply, { passive: true });

          queueApply();
          window.setTimeout(queueApply, 250);
          window.setTimeout(queueApply, 700);
        };

        const installBraindanceScrubber = async () => {
          const host = document.getElementById('bd-scrubber');
          if (!(host instanceof HTMLElement)) {
            return;
          }
          if ((host.dataset.readyVersion || '').startsWith('3')) {
            return;
          }
          host.dataset.readyVersion = '3-loading';
          if (typeof host.__bdCleanup === 'function') {
            host.__bdCleanup();
          }
          host.removeAttribute('aria-hidden');

          const fallbackMemories = [
            {
              title: 'High School Robot',
              role: 'Mechanical Build',
              photo: 'sidequests/robot/IMG_6041.jpg',
              mediaType: 'image',
              log: 'Custom VEX-style robot I designed and built in high school. Frame, gearing, and structure tuned through rebuilds.',
              links: [],
            },
            {
              title: 'Robot Test Run',
              role: 'Field Footage',
              photo: 'sidequests/robot/IMG_6046.mp4',
              mediaType: 'video',
              log: 'Field test footage from the same build. Captures movement and mechanisms in action.',
              links: [],
            },
          ];
          let memories = fallbackMemories;
          try {
            const response = await fetch('sidequests/sidequests.json', { cache: 'no-store' });
            if (response.ok) {
              const parsed = await response.json();
              if (Array.isArray(parsed) && parsed.length > 0) {
                memories = parsed;
              }
            }
          } catch (_) {}

          let activeIndex = 0;
          host.dataset.ready = '1';
          host.dataset.readyVersion = '3';
          host.innerHTML = `
            <div class="bd-shell">
              <div class="bd-topline">
                <h3 class="bd-title">SIDEQUEST ARCHIVE</h3>
                <p class="bd-sub">VISUAL / AUDIO</p>
              </div>
              <div class="bd-step-track"></div>
              <div class="bd-card-host"></div>
            </div>
          `;

          const cardHost = host.querySelector('.bd-card-host');
          const stepTrack = host.querySelector('.bd-step-track');
          if (!(cardHost instanceof HTMLElement) || !(stepTrack instanceof HTMLElement)) {
            return;
          }

          stepTrack.innerHTML = memories
            .map(
              (_, idx) =>
                `<button type="button" class="bd-step" data-index="${idx}" data-active="${idx === 0 ? 'true' : 'false'}" aria-label="Jump to memory ${idx + 1}"></button>`
            )
            .join('');
          stepTrack.style.setProperty('--bd-steps', String(memories.length));
          const steps = Array.from(stepTrack.querySelectorAll('.bd-step'));

          const renderCard = () => {
            const memory = memories[activeIndex];
            const mediaType = memory.mediaType === 'video' ? 'video' : 'image';
            const primaryVisual = memory.photo
              ? mediaType === 'video'
                ? `<video class="bd-visual-img" src="${memory.photo}" autoplay muted loop playsinline preload="metadata"></video>`
                : `<img class="bd-visual-img" src="${memory.photo}" alt="${memory.title}" loading="lazy" />`
              : '';
            const secondaryVisual =
              memory.secondaryMedia && memory.secondaryMedia.src
                ? memory.secondaryMedia.type === 'video'
                  ? `<video class="bd-visual-media-item" src="${memory.secondaryMedia.src}" autoplay muted loop playsinline preload="metadata"></video>`
                  : `<img class="bd-visual-media-item" src="${memory.secondaryMedia.src}" alt="${memory.title}" loading="lazy" />`
                : '';
            const visual =
              secondaryVisual.length > 0
                ? `<div class="bd-visual-media-stack">${primaryVisual.replace('bd-visual-img', 'bd-visual-media-item')}${secondaryVisual}</div>`
                : primaryVisual;
            const links =
              Array.isArray(memory.links) && memory.links.length > 0
                ? `<div class="bd-links">${memory.links
                    .map(
                      ([label, href]) =>
                        `<a class="bd-link-chip" href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`
                    )
                    .join('')}</div>`
                : '';

            cardHost.innerHTML = `
              <article class="bd-card bd-card-active">
                <div class="bd-main">
                  <div class="bd-visual-wrap">
                    <div class="bd-layer">Visual Layer</div>
                    <div class="bd-visual">${visual}</div>
                  </div>
                  <div class="bd-audio">
                    <div class="bd-layer">Audio Layer</div>
                    <div class="bd-quest-meta">
                      <span class="bd-meta-chip">${memory.title}</span>
                      <span class="bd-meta-chip">${memory.role}</span>
                    </div>
                    <p class="bd-audio-copy">${memory.log}</p>
                    ${links}
                  </div>
                </div>
              </article>
            `;
            steps.forEach((step, idx) => {
              step.setAttribute('data-active', idx === activeIndex ? 'true' : 'false');
            });
          };

          const go = (delta) => {
            activeIndex = (activeIndex + delta + memories.length) % memories.length;
            renderCard();
          };

          steps.forEach((btn) => {
            btn.addEventListener('click', () => {
              activeIndex = Number(btn.getAttribute('data-index') || '0');
              renderCard();
            });
          });

          const isSidequestsActive = () => {
            const activeNav = document.querySelector('.nav-tags a[data-active="true"]');
            const activeLabel = normalizeLabel(activeNav?.textContent || '');
            const sidequestsPanelVisible = !!document.querySelector('.sidequests-panel.visible');
            const hostRect = host.getBoundingClientRect();
            const scrubberVisible = hostRect.width > 0 && hostRect.height > 0;
            const scrubberDisplayed = getComputedStyle(host).display !== 'none';
            return (
              document.body.classList.contains('sidequests-active') ||
              activeLabel === 'SIDEQUESTS' ||
              sidequestsPanelVisible ||
              scrubberVisible ||
              scrubberDisplayed
            );
          };

          const onArchiveKeydown = (event) => {
            if (!isSidequestsActive()) {
              return;
            }
            const key = event.key || '';
            const code = event.code || '';
            const goNext =
              key === 'ArrowRight' || key === 'ArrowDown' || code === 'ArrowRight' || code === 'ArrowDown';
            const goPrev =
              key === 'ArrowLeft' || key === 'ArrowUp' || code === 'ArrowLeft' || code === 'ArrowUp';
            if (goNext) {
              console.log('[BD Scrubber] Arrow next', activeIndex);
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              if (activeIndex >= memories.length - 1) {
                if (!dispatchNavigationTo('CONTACT')) {
                  dispatchNavigationTo('Contact');
                }
                return;
              }
              go(1);
            } else if (goPrev) {
              console.log('[BD Scrubber] Arrow prev', activeIndex);
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              if (activeIndex <= 0) {
                if (!dispatchNavigationTo('TECHNOLOGIES')) {
                  dispatchNavigationTo('Technologies');
                }
                return;
              }
              go(-1);
            }
          };
          document.addEventListener('keydown', onArchiveKeydown, { capture: true });
          window.addEventListener('keydown', onArchiveKeydown, { capture: true });

          let lastWheelAt = 0;
          let sidequestsActiveLatch = false;
          let sidequestsEnteredAt = 0;
          const onArchiveWheel = (event) => {
            const active = isSidequestsActive();
            if (!active) {
              sidequestsActiveLatch = false;
              return;
            }
            const now = Date.now();
            if (!sidequestsActiveLatch) {
              sidequestsActiveLatch = true;
              sidequestsEnteredAt = now;
            }
            // Always consume wheel on sidequests so section-level wheel navigation never leaks through.
            event.preventDefault();
            event.stopImmediatePropagation();
            event.stopPropagation();

            // Ignore initial wheel/momentum just after entering sidequests to avoid skipping edge cards.
            if (now - sidequestsEnteredAt < 420) {
              return;
            }
            if (now - lastWheelAt < 260) {
              return;
            }
            const delta = event.deltaY;
            if (Math.abs(delta) < 8) {
              return;
            }
            lastWheelAt = now;
            if (delta > 0) {
              if (activeIndex < memories.length - 1) {
                go(1);
              } else if (!dispatchNavigationTo('CONTACT')) {
                dispatchNavigationTo('Contact');
              }
            } else if (delta < 0) {
              if (activeIndex > 0) {
                go(-1);
              } else if (!dispatchNavigationTo('TECHNOLOGIES')) {
                dispatchNavigationTo('Technologies');
              }
            }
          };
          window.addEventListener('wheel', onArchiveWheel, { capture: true, passive: false });
          host.__bdCleanup = () => {
            document.removeEventListener('keydown', onArchiveKeydown, { capture: true });
            window.removeEventListener('keydown', onArchiveKeydown, { capture: true });
            window.removeEventListener('wheel', onArchiveWheel, { capture: true });
          };

          renderCard();
        };

        const dispatchNavigationKey = (key) => {
          window.dispatchEvent(
            new KeyboardEvent('keydown', {
              key,
              bubbles: true,
              cancelable: true,
            })
          );
        };

        const dispatchNavigationTo = (targetLabel) => {
          const navLinks = Array.from(document.querySelectorAll('.nav-tags a'));
          const match = navLinks.find((link) => normalizeLabel(link.textContent || '') === normalizeLabel(targetLabel));
          if (!match) {
            return false;
          }
          match.dispatchEvent(
            new MouseEvent('click', {
              bubbles: true,
              cancelable: true,
            })
          );
          return true;
        };

        const dispatchNavigationHome = () => dispatchNavigationTo('HOME');

        const warmupCameraRoutes = async () => {
          const ready = await waitForCanvas(8000);
          if (!ready) {
            console.warn('[loader] skipped camera warmup: canvas not ready');
            return false;
          }

          const warmupSteps = [
            { key: 'ArrowDown', scene: 'PROFILE', waitMs: 900 },
            { key: 'ArrowDown', scene: 'EXPERIENCE', waitMs: 900 },
            { scene: 'SIDEQUESTS', waitMs: 600, nav: 'SIDEQUESTS' },
            { key: 'ArrowDown', scene: 'CONTACT', waitMs: 860 },
            { scene: 'HOME', waitMs: 560, home: true },
          ];

          window.__PRELOAD_ALLOW_NAV__ = true;
          try {
            await wait(260);
            for (let stepIndex = 0; stepIndex < warmupSteps.length; stepIndex += 1) {
              const step = warmupSteps[stepIndex];
              if (hint instanceof HTMLElement) {
                hint.textContent = `Warming scene camera ${stepIndex + 1}/${warmupSteps.length}: ${step.scene}`;
              }
              if (step.home) {
                const movedHome = dispatchNavigationHome();
                if (!movedHome) {
                  for (let up = 0; up < 4; up += 1) {
                    dispatchNavigationKey('ArrowUp');
                    await wait(140);
                  }
                }
              } else if (step.nav) {
                dispatchNavigationTo(step.nav);
              } else {
                dispatchNavigationKey(step.key);
              }
              await wait(step.waitMs);
            }
            await wait(160);
            return true;
          } finally {
            window.__PRELOAD_ALLOW_NAV__ = false;
          }
        };

        const boot = async () => {
          document.body.classList.add('preload-silent');
          try {
            installSceneClassSync();
            setProgress(0, 1, 'Loading asset manifest...');
            const manifestResponse = await fetch(MANIFEST_PATH, { cache: 'no-cache' });
            if (!manifestResponse.ok) {
              throw new Error(`Manifest request failed: ${manifestResponse.status}`);
            }
            const manifest = await manifestResponse.json();
            const allAssets = Array.isArray(manifest.assets) ? manifest.assets : [];
            const assets = allAssets.filter((assetPath) => {
              if (typeof assetPath !== 'string') return false;
              // Home-first boot: skip heavy non-home assets during preload.
              return !(
                assetPath.includes('sidequests/') ||
                assetPath.includes('IMG_0508') ||
                assetPath.includes('IMG_6904') ||
                assetPath.includes('signal-2026-02-27-164119') ||
                assetPath.includes('vocaview-feature')
              );
            });
            const totalSteps = assets.length + 1;

            if (hint instanceof HTMLElement) {
              hint.textContent = `Preloading ${assets.length} home assets.`;
            }

            setProgress(0, totalSteps, `Preloading assets... 0/${assets.length}`);
            const { failed } = await preloadInBatches(assets, (doneCount, failedCount) => {
              const failSuffix = failedCount > 0 ? ` (${failedCount} failed)` : '';
              setProgress(doneCount, totalSteps, `Preloading assets... ${doneCount}/${assets.length}${failSuffix}`);
            });

            setProgress(assets.length, totalSteps, 'Booting interface...');
            await loadRuntime();
            installUiSfx();
            installMobileHeroAutoLayout();
            setProgress(totalSteps, totalSteps, failed > 0 ? 'Ready (with some preload misses).' : 'Ready.');
          } catch (error) {
            console.error('[loader] failed, booting runtime directly', error);
            setProgress(0, 1, 'Loader failed. Booting directly...');
            await loadRuntime();
            installUiSfx();
            installMobileHeroAutoLayout();
          }

          document.body.classList.remove('preload-silent');
          if (loader instanceof HTMLElement) {
            loader.classList.add('done');
            window.setTimeout(() => loader.remove(), 950);
          }
        };

        void boot();
      })();
    </script>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const enabled = params.get('heroTune') === '1';
        const mobile = window.matchMedia('(max-width: 900px)').matches;
        if (!enabled || !mobile) return;

        const root = document.documentElement;
        const STORAGE_KEY = 'hero-mobile-tune-v1';
        const defaults = { x: 0, y: 0, scale: 0.46 };
        let state = { ...defaults };

        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          if (Number.isFinite(saved.x)) state.x = saved.x;
          if (Number.isFinite(saved.y)) state.y = saved.y;
          if (Number.isFinite(saved.scale)) state.scale = saved.scale;
        } catch {}

        const applyState = () => {
          root.style.setProperty('--hero-mobile-x', `${state.x}px`);
          root.style.setProperty('--hero-mobile-y', `${state.y}px`);
          root.style.setProperty('--hero-mobile-scale', String(state.scale));
        };

        const saveState = () => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch {}
        };

        const panel = document.createElement('div');
        panel.id = 'hero-tuner-panel';
        panel.style.cssText = [
          'position:fixed',
          'left:10px',
          'bottom:10px',
          'z-index:13000',
          'width:min(92vw,340px)',
          'background:rgba(0,8,20,0.9)',
          'border:1px solid rgba(0,240,255,0.55)',
          'color:#e8f6ff',
          'font-family:Share Tech Mono, monospace',
          'font-size:12px',
          'padding:10px',
          'display:grid',
          'gap:8px',
          'backdrop-filter:blur(4px)',
        ].join(';');

        const row = (label, min, max, step, value, onInput) => {
          const wrap = document.createElement('label');
          wrap.style.display = 'grid';
          wrap.style.gap = '4px';
          const top = document.createElement('div');
          top.textContent = label;
          const input = document.createElement('input');
          input.type = 'range';
          input.min = String(min);
          input.max = String(max);
          input.step = String(step);
          input.value = String(value);
          input.addEventListener('input', () => onInput(Number(input.value)));
          wrap.append(top, input);
          return { wrap, input };
        };

        const valueLine = document.createElement('div');
        valueLine.style.opacity = '0.9';

        const xRow = row('X', -280, 280, 1, state.x, (v) => {
          state.x = v;
          applyState();
          renderValues();
          saveState();
        });
        const yRow = row('Y', -280, 280, 1, state.y, (v) => {
          state.y = v;
          applyState();
          renderValues();
          saveState();
        });
        const sRow = row('Scale', 0.28, 0.72, 0.005, state.scale, (v) => {
          state.scale = Number(v.toFixed(3));
          applyState();
          renderValues();
          saveState();
        });

        const btnRow = document.createElement('div');
        btnRow.style.display = 'flex';
        btnRow.style.gap = '8px';

        const mkBtn = (txt, onClick) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = txt;
          btn.style.cssText = [
            'border:1px solid rgba(0,240,255,0.65)',
            'background:rgba(0,240,255,0.2)',
            'color:#e8f6ff',
            'font:inherit',
            'padding:6px 8px',
            'cursor:pointer',
          ].join(';');
          btn.addEventListener('click', onClick);
          return btn;
        };

        const copyBtn = mkBtn('Copy Values', async () => {
          const txt = `x=${state.x}, y=${state.y}, scale=${state.scale}`;
          try {
            await navigator.clipboard.writeText(txt);
            copyBtn.textContent = 'Copied';
            window.setTimeout(() => {
              copyBtn.textContent = 'Copy Values';
            }, 900);
          } catch {
            copyBtn.textContent = txt;
          }
        });

        const resetBtn = mkBtn('Reset', () => {
          state = { ...defaults };
          xRow.input.value = String(state.x);
          yRow.input.value = String(state.y);
          sRow.input.value = String(state.scale);
          applyState();
          renderValues();
          saveState();
        });

        const renderValues = () => {
          valueLine.textContent = `x=${state.x}, y=${state.y}, scale=${state.scale}`;
        };

        btnRow.append(copyBtn, resetBtn);
        panel.append(valueLine, xRow.wrap, yRow.wrap, sRow.wrap, btnRow);
        document.body.appendChild(panel);

        const findHero = () => document.querySelector('.hero-name');
        let activeHero = null;
        let dragState = null;

        const onPointerMove = (event) => {
          if (!dragState) return;
          const dx = event.clientX - dragState.startX;
          const dy = event.clientY - dragState.startY;
          state.x = Math.round(dragState.baseX + dx);
          state.y = Math.round(dragState.baseY + dy);
          xRow.input.value = String(state.x);
          yRow.input.value = String(state.y);
          applyState();
          renderValues();
        };

        const onPointerUp = () => {
          if (!dragState) return;
          dragState = null;
          saveState();
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
        };

        const bindHeroDrag = () => {
          const hero = findHero();
          if (!hero || hero === activeHero) return;
          activeHero = hero;
          const heroText = hero.closest('.hero-text');
          if (heroText instanceof HTMLElement) {
            heroText.style.pointerEvents = 'auto';
          }
          hero.style.pointerEvents = 'auto';
          hero.style.touchAction = 'none';
          hero.style.cursor = 'grab';
          hero.addEventListener('pointerdown', (event) => {
            if (!hero.closest('.hero-text')) return;
            dragState = {
              startX: event.clientX,
              startY: event.clientY,
              baseX: state.x,
              baseY: state.y,
            };
            hero.style.cursor = 'grabbing';
            window.addEventListener('pointermove', onPointerMove, { passive: true });
            window.addEventListener('pointerup', () => {
              hero.style.cursor = 'grab';
            }, { once: true });
            window.addEventListener('pointerup', onPointerUp, { once: true });
          });
        };

        applyState();
        renderValues();
        bindHeroDrag();
        const observer = new MutationObserver(() => bindHeroDrag());
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
